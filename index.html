<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Centre Nouvelle Dimension</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f5f7fc;--fg:#10152b;--card:#fff;--mut:#5b6380;--line:#d9deee;--blue:#1d3fd8;--bl2:#e6ebff;--ok:#12803c;--ko:#c0261f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1226;--fg:#eef1fb;--card:#161d38;--mut:#a3abc9;--line:#2a3358;--blue:#7d95ff;--bl2:#1e2748;--ok:#4cd07f;--ko:#ff7d75;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1226;--fg:#eef1fb;--card:#161d38;--mut:#a3abc9;--line:#2a3358;--blue:#7d95ff;--bl2:#1e2748;--ok:#4cd07f;--ko:#ff7d75;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Georgia,"Times New Roman",serif}
h1,h2,h3,button,input,select,th,.sans{font-family:"Trebuchet MS",Verdana,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:3px solid var(--blue);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header img{width:44px;height:auto}header b{flex:1;font:700 15px/1.2 "Trebuchet MS",Verdana,sans-serif}
header small{display:block;font-weight:400;color:var(--mut)}
main{max-width:960px;margin:0 auto;padding:12px}#app.has{display:flex;gap:10px;align-items:flex-start}.cnt{flex:1;min-width:0}.side{display:flex;flex-direction:column;gap:6px;width:clamp(104px,30vw,160px);flex:none;position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);max-height:calc(100vh - 100px);overflow-y:auto;padding-right:2px}.side button{width:100%;text-align:left;font-size:13px;padding:10px 8px;overflow-wrap:anywhere}.nm{flex:1;display:flex;flex-direction:column;text-align:left}.nm small{color:var(--mut);font-size:13px}.sub{display:flex;flex-direction:column;gap:6px;padding-left:8px;border-left:2px solid var(--line)}.side button.on{background:var(--blue);color:var(--card)}
h2{font-size:20px;margin:22px 0 8px}h3{font-size:16px;margin:0 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.card p{margin:2px 0;color:var(--mut);font-size:14px}
button{background:var(--blue);color:var(--card);border:0;border-radius:8px;padding:9px 14px;font-size:14px;font-weight:700;cursor:pointer}
button.g{background:transparent;color:var(--blue);border:1px solid var(--blue)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list button.it{display:flex;width:100%;justify-content:space-between;background:var(--card);color:var(--fg);border:1px solid var(--line);margin:6px 0;text-align:left;font-weight:400}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mut);font-size:13px}
td input{width:54px;padding:5px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
td input:disabled{opacity:.45}
.ok{color:var(--ok);font-weight:700}.ko{color:var(--ko);font-weight:700}.err{color:var(--ko);font-size:12px}
.bh{display:flex;gap:12px;align-items:center;border:2px solid var(--blue);border-radius:10px;padding:10px 14px;margin:8px 0}
.bh img{width:56px}.bh div{flex:1;text-align:center;font:700 13px/1.3 "Trebuchet MS",Verdana,sans-serif}
.av{width:56px;height:56px;border-radius:10px;background:var(--bl2);color:var(--blue);display:grid;place-items:center;font:700 22px "Trebuchet MS",sans-serif}
.sum{font:700 18px "Trebuchet MS",sans-serif}
.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:9;padding:16px}
.modal .card{max-width:340px;width:100%}
.modal input{width:100%;padding:9px;margin:4px 0;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.note{font-size:13px;color:var(--mut);margin-top:10px}
</style></head><body>
